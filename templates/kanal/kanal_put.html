{% extends 'base.html' %}
{% block title %}Kanalni Tahrirlash - UzbekTube{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning">
                <h3 class="mb-0">Kanalni Tahrirlash</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">
                    <strong>Hozirgi identifikator:</strong> @{{ kanal.identifikator }}
                    <em class="text-danger">(o'zgartirib bo'lmaydi)</em>
                </p>

                <form method="POST" action="{% url 'kanal_tahrirlash' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nomi" class="form-label">Kanal nomi <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nomi" name="nomi"
                               value="{{ kanal.nomi }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Tavsif</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ kanal.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="havolalar" class="form-label">Ijtimoiy tarmoq havolasi</label>
                        <input type="url" class="form-control" id="havolalar" name="havolalar"
                               value="{{ kanal.havolalar|default:'' }}" placeholder="https://t.me/kanal_nomi">
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'kanal_detay' %}" class="btn btn-secondary">Bekor qilish</a>
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-pencil"></i> Saqlash
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
